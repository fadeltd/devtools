name: Bug report
description: A tool gave the wrong output, broke, hung, or looked wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Issues are public.** Before you paste anything below, replace real tokens, keys, passwords and customer data with made-up values of the same shape. The site never sends your input anywhere; please don't post it here either.

  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      options:
        - Diff Checker
        - JSON Formatter
        - JSON to Types
        - Base64
        - List Tools
        - ID Generator
        - Text Statistics
        - HTML to Text
        - Timestamp Converter
        - JWT Decoder
        - URL Encode / Decode
        - Hash Text
        - HMAC Signature
        - Slug Generator
        - Text to Binary / Hex
        - Number Converter
        - Unicode Inspector
        - YAML / JSON / TOML
        - SQL Formatter
        - CSS Formatter
        - CSV to Table
        - .env Converter
        - Cron Explainer
        - String Escaper
        - Color Converter
        - Contrast Checker
        - QR Code
        - Lorem Ipsum
        - Regex Tester
        - The site itself (⌘K palette, sidebar, shortcuts, saved state)
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, including any error badge or message.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: input
    attributes:
      label: Smallest input that shows it
      description: The fewest lines or characters that still reproduce the problem, plus any options you had on (e.g. "Natural sort, descending"). Most bugs here are about exact characters, so whitespace, line endings and Unicode matter.
      render: text
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Safari 18.4 on iOS 18, Chrome 141 on macOS 15
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Desktop / laptop
        - Phone
        - Tablet
    validations:
      required: true

  - type: checkboxes
    id: scrubbed
    attributes:
      label: Before submitting
      options:
        - label: I replaced any real secrets or personal data in this issue with made-up values.
          required: true
