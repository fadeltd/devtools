name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# Cancel superseded runs on the same ref: only the latest push matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A PR builds GitHub's merge commit; its parents are the base and the
          # PR head, which the changelog check compares.
          fetch-depth: 2

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Fails loudly if the lockfile has drifted, which is the point of pnpm here.
      - run: pnpm install --frozen-lockfile

      # A branch cut before a release commit landed merges its [Unreleased]
      # lines into the section that release created, so the merge releases
      # nothing (#19 did exactly this to 0.9.0).
      - name: Check changelog entries stay under [Unreleased]
        if: github.event_name == 'pull_request'
        run: pnpm exec vite-node scripts/check-changelog.ts

      # Builds @fadeltd/devtools-core first: the app imports its compiled dist/.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # What npm users would get. Fails if the tarball lost its type
      # declarations or picked up tests and fixtures.
      - name: Check the devtools-core tarball
        working-directory: packages/core
        run: |
          set -euo pipefail
          pnpm pack --pack-destination "$RUNNER_TEMP" >/dev/null
          LIST=$(tar -tzf "$RUNNER_TEMP"/fadeltd-devtools-core-*.tgz)
          for sub in base64 color cron css csv diff env escape hash html-text id-gen json json-types jwt list lorem number qr random regex share slug sql text text-bytes text-stats timestamp unicode url yaml-toml; do
            # A here-string, not `echo | grep -q`: grep -q stops reading at the
            # first match, and under pipefail the writer's SIGPIPE fails the step.
            grep -qx "package/dist/$sub/index.d.ts" <<< "$LIST" || { echo "::error::Missing dist/$sub/index.d.ts"; exit 1; }
          done
          if echo "$LIST" | grep -E '\.test\.|fixture'; then
            echo "::error::Tests or fixtures would be published."
            exit 1
          fi

      # First-load JS is what every visitor pays for before any tool runs: the
      # entry plus every chunk the HTML modulepreloads (the registry sits in
      # one) and registerSW.js. If a heavy dependency escapes a lazy route
      # chunk, this is where we find out rather than in production.
      - name: Check first-load JS budget
        run: |
          BUDGET=107520
          LIST="$RUNNER_TEMP/first-load.txt"
          grep -oE '(src|href)="/[^"]+\.js"' dist/index.html | sed -E 's/^(src|href)="\///; s/"$//' > "$LIST" || true
          if ! grep -qE '^assets/index-[^/]+\.js$' "$LIST"; then
            echo "::error::No entry script found in dist/index.html."
            exit 1
          fi
          TOTAL=0
          while read -r FILE; do
            SIZE=$(gzip -c "dist/$FILE" | wc -c | tr -d ' ')
            echo "${SIZE}B  $FILE"
            TOTAL=$((TOTAL + SIZE))
          done < "$LIST"
          echo "first-load JS, gzipped: ${TOTAL}B   budget: ${BUDGET}B"
          if [ "$TOTAL" -gt "$BUDGET" ]; then
            echo "::error::First-load JS ${TOTAL}B exceeds the ${BUDGET}B budget."
            exit 1
          fi
