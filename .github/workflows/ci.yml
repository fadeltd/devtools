name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# Cancel superseded runs on the same ref: only the latest push matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Fails loudly if the lockfile has drifted, which is the point of pnpm here.
      - run: pnpm install --frozen-lockfile

      # Builds @fadeltd/devtools-core first: the app imports its compiled dist/.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # What npm users would get. Fails if the tarball lost its type
      # declarations or picked up tests and fixtures.
      - name: Check the devtools-core tarball
        working-directory: packages/core
        run: |
          set -euo pipefail
          pnpm pack --pack-destination "$RUNNER_TEMP" >/dev/null
          LIST=$(tar -tzf "$RUNNER_TEMP"/fadeltd-devtools-core-*.tgz)
          for sub in base64 diff html-text id-gen json list random text text-stats; do
            echo "$LIST" | grep -qx "package/dist/$sub/index.d.ts" || { echo "::error::Missing dist/$sub/index.d.ts"; exit 1; }
          done
          if echo "$LIST" | grep -E '\.test\.|fixture'; then
            echo "::error::Tests or fixtures would be published."
            exit 1
          fi

      # The entry bundle is what every visitor pays for on first load. If a
      # heavy dependency escapes a lazy route chunk, this is where we find out
      # rather than in production.
      - name: Check entry bundle budget
        run: |
          BUDGET=92160
          ENTRY=$(find dist/assets -name 'index-*.js' -print -quit)
          SIZE=$(gzip -c "$ENTRY" | wc -c | tr -d ' ')
          echo "entry: $ENTRY"
          echo "gzipped: ${SIZE}B   budget: ${BUDGET}B"
          if [ "$SIZE" -gt "$BUDGET" ]; then
            echo "::error::Entry bundle ${SIZE}B exceeds the ${BUDGET}B budget."
            exit 1
          fi
