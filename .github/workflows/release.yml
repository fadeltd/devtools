name: Release

# Merging to main does not deploy directly. It derives the next version from
# the [Unreleased] section of CHANGELOG.md, rewrites the changelog, commits
# that back to main, and pushes a tag. The TAG is what deploys.
#
# @fadeltd/devtools-core is released the same way from its own changelog
# (packages/core/CHANGELOG.md, tags core-v*) and published to npm. The two are
# versioned independently: either, both or neither may release on a merge.
#
# A merge with an empty [Unreleased] releases nothing, so merging and releasing
# stay separate decisions.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  # OIDC for npm trusted publishing: the registry verifies this workflow
  # instead of a stored token, and attaches provenance.
  id-token: write

jobs:
  release:
    name: Cut a release from the changelog
    runs-on: ubuntu-latest
    # Never react to our own release commit.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v7
        with:
          # Check out the BRANCH TIP, not the commit that triggered the run.
          # On a re-run the triggering sha is stale, and committing on top of it
          # produces a non-fast-forward push that is rejected. Combined with the
          # changelog logic being idempotent -- an empty [Unreleased] releases
          # nothing -- this makes a re-run safe rather than broken.
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          # Points npm at the public registry for the trusted-publishing step.
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - id: cut
        name: Derive the site version from CHANGELOG.md
        run: pnpm exec vite-node scripts/release.ts

      - id: cut_core
        name: Derive the devtools-core version from packages/core/CHANGELOG.md
        run: >-
          pnpm exec vite-node scripts/release.ts
          --changelog packages/core/CHANGELOG.md
          --package packages/core/package.json
          --tag-prefix core-v

      - name: Commit the changelogs
        if: steps.cut.outputs.released == 'true' || steps.cut_core.outputs.released == 'true'
        env:
          SITE_TAG: ${{ steps.cut.outputs.tag }}
          CORE_TAG: ${{ steps.cut_core.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILES="CHANGELOG.md package.json packages/core/CHANGELOG.md packages/core/package.json"
          TAGS=$(echo "${SITE_TAG} ${CORE_TAG}" | xargs)

          # Guarded, so a partially-completed earlier attempt can be resumed
          # rather than blocking every retry.
          if git diff --quiet -- $FILES; then
            echo "::notice::Changelogs and versions already committed."
          else
            git add $FILES
            # [skip ci] so this push cannot re-enter this workflow when a PAT
            # is in use -- with a PAT, pushes DO trigger workflows.
            git commit -m "Release ${TAGS} [skip ci]"
            git push origin HEAD:main
          fi

      # Runs on every merge, not only when this run cut something, and tags
      # every release commit that is still missing its tags: this run's, and
      # any an earlier run committed but failed to tag. Tags go on the release
      # commit itself -- the one whose subject names them -- never on whatever
      # main points at.
      #
      # It walks back from main to the newest release commit whose tags and
      # GitHub releases all exist, then works oldest first, so tags and GitHub releases are created
      # in version order and history before that point is left alone.
      #
      # No pipeline here may stop reading early (`awk '{ ...; exit }'`,
      # `grep -q`, `head`): under pipefail the writer then dies of SIGPIPE,
      # exit 141 fails the step, and that is how v0.8.0 to v0.9.0 were left
      # untagged and undeployed.
      - id: tag
        name: Tag and publish GitHub releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin main
          git ls-remote --tags origin > "$RUNNER_TEMP/remote-tags"

          remote_sha() {
            local tag=$1 sha="" ref_sha ref
            # The peeled ^{} line, when present, is the commit an annotated
            # tag points at; it is listed after the tag object itself.
            while read -r ref_sha ref; do
              if [ "$ref" = "refs/tags/${tag}" ] || [ "$ref" = "refs/tags/${tag}^{}" ]; then sha=$ref_sha; fi
            done < "$RUNNER_TEMP/remote-tags"
            echo "$sha"
          }

          # Release tags named in a commit subject, minus "[skip ci]".
          tags_of() {
            local word
            for word in $1; do
              case "$word" in v[0-9]*|core-v[0-9]*) echo "$word" ;; esac
            done
          }

          # A file, not a pipe or process substitution: the loop stops early.
          git log -n 100 --format='%H %s' origin/main > "$RUNNER_TEMP/log"
          PENDING=()
          while read -r SHA WORD REST; do
            [ "$WORD" = "Release" ] || continue
            DONE=true
            for TAG in $(tags_of "$REST"); do
              [ -n "$(remote_sha "$TAG")" ] || DONE=false
              gh release view "$TAG" > /dev/null 2>&1 || DONE=false
            done
            [ "$DONE" = false ] || break
            PENDING=("$SHA" "${PENDING[@]}")
          done < "$RUNNER_TEMP/log"

          DEPLOY_TAG=""
          for SHA in "${PENDING[@]}"; do
            SUBJECT=$(git log -n 1 --format=%s "$SHA")
            for TAG in $(tags_of "${SUBJECT#Release }"); do
              REMOTE=$(remote_sha "$TAG")
              if [ -z "$REMOTE" ]; then
                git tag -a "$TAG" "$SHA" -m "$TAG"
                git push origin "refs/tags/${TAG}"
                echo "Tagged ${TAG} on ${SHA}" >> "$GITHUB_STEP_SUMMARY"
              elif [ "$REMOTE" != "$SHA" ]; then
                # core-v0.1.0 was once pushed by hand onto the merge commit;
                # trusting it attached the release to code still at 0.0.0.
                echo "::error::${TAG} exists but points at ${REMOTE}, not the release commit ${SHA}. Tags are created only by this workflow: delete the stray tag (and its GitHub release, if any) and re-run."
                exit 1
              fi

              case "$TAG" in
                core-v*) FILE=packages/core/CHANGELOG.md; TITLE="@fadeltd/devtools-core ${TAG#core-v}" ;;
                *)       FILE=CHANGELOG.md;               TITLE="$TAG" ;;
              esac
              if ! gh release view "$TAG" > /dev/null 2>&1; then
                # Notes come from the changelog as it was at that release
                # commit, and go through a file, never an Actions expression:
                # expressions are pasted into the script before bash parses
                # it, so a backtick in the notes would run as a command.
                git show "${SHA}:${FILE}" > "$RUNNER_TEMP/changelog.md"
                pnpm exec vite-node scripts/release-notes.ts "$RUNNER_TEMP/changelog.md" "${TAG#*v}" > "$RUNNER_TEMP/notes.md"
                gh release create "$TAG" --verify-tag --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
              fi
              case "$TAG" in v*) DEPLOY_TAG=$TAG ;; esac
            done
          done
          echo "deploy_tag=${DEPLOY_TAG}" >> "$GITHUB_OUTPUT"

      # Always dispatch when a site tag was made or completed, for the newest
      # one only: it contains every earlier release.
      #
      # Never left to `on: push: tags`. With a PAT present that path silently
      # took over once and no deploy ever happened: the tag was pushed, Release
      # reported success, and Deploy had zero runs. Dispatching removes the
      # dependency on how GitHub attributes the push. Deploy is idempotent, so a
      # duplicate run is harmless, whereas a missed one is invisible.
      - name: Start Deploy
        if: steps.tag.outputs.deploy_tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.deploy_tag }}
        run: gh workflow run deploy.yml --ref main -f tag="$TAG"

      # Trusted publishing (OIDC): npm verifies that this workflow, in this
      # repo, is the one allowed to publish. No npm token is stored anywhere,
      # so there is nothing to leak or rotate, and provenance is automatic.
      #
      # Runs on every merge, not only when core was just cut, and publishes
      # whatever version packages/core/package.json says if npm lacks it, so a
      # failed publish is caught up by the next run instead of being lost
      # behind a pushed tag. It comes after the Deploy dispatch so it can never
      # hold up the site.
      - name: Publish @fadeltd/devtools-core to npm
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/core/package.json').version")
          if [ "$VERSION" = "0.0.0" ]; then
            echo "::notice::devtools-core has never been released; nothing to publish."
            exit 0
          fi
          if npm view "@fadeltd/devtools-core@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::@fadeltd/devtools-core@${VERSION} is already on npm."
            exit 0
          fi
          # npm only accepts a trusted publisher for a package name that exists.
          # The name is registered (with an empty placeholder) and trusted, so
          # this only fires if that setup is ever lost.
          if ! npm view @fadeltd/devtools-core name >/dev/null 2>&1; then
            echo "::warning::@fadeltd/devtools-core is not registered on npm, so no trusted publisher can exist for it. See CONTRIBUTING.md, 'Trusted publisher setup', then re-run this workflow."
            exit 0
          fi
          # OIDC publishing needs npm 11.5.1+; Node 22 ships npm 10.
          npm install -g npm@11
          pnpm core:build
          cd packages/core
          npm publish --access public
          echo "Published @fadeltd/devtools-core@${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        run: |
          if [ -n "${{ steps.tag.outputs.deploy_tag }}" ]; then
            echo "Deploying ${{ steps.tag.outputs.deploy_tag }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.cut.outputs.released }}" = "true" ]; then
            echo "Released ${{ steps.cut.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.cut_core.outputs.released }}" = "true" ]; then
            echo "Released ${{ steps.cut_core.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.cut.outputs.released }}" != "true" ] && [ "${{ steps.cut_core.outputs.released }}" != "true" ]; then
            echo "No [Unreleased] entries — nothing released." >> "$GITHUB_STEP_SUMMARY"
          fi
